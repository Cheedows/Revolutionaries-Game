name: Android

# A playtest build you can install from a phone.
#
# Every push builds a debug APK and attaches it to the run, so it can be
# downloaded from the Actions tab on the phone it is going to be installed on.
# A push to master also rolls the "mobile-latest" prerelease over to it, which
# is a shorter path to the same file: the Releases page keeps one permanent
# link to the newest build.
#
# Nothing here needs a secret. Android requires an APK to be signed before it
# can be installed at all, and refuses to install a new version signed with a
# different key than the one on the device, so the build signs with the debug
# key checked in at tools/android/debug.keystore — the same one every time, so
# a new build installs over the last one and the saves survive. It is enough to
# install and play; it is not enough to publish, and deliberately so. See
# tools/android/README.md.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.6-stable

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Install the export templates
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz
          # The archive unpacks to templates/; Godot looks for them under the
          # version they belong to.
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$dest"
          mv templates/* "$dest/"
          ls "$dest" | head

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Godot signs the APK itself, with apksigner and zipalign out of the
      # SDK's build-tools. The runner image ships the SDK but not necessarily
      # those, and Godot's complaint when they are missing is an empty list of
      # configuration errors, so they are installed rather than assumed.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install the SDK pieces Godot signs with
        run: sdkmanager --install "platform-tools" "build-tools;34.0.0"

      - name: Check the playtest signing key is there
        run: |
          # Checked in rather than generated: a key that changes every build
          # means every build has to be installed over an uninstall, and an
          # uninstall takes the player's saves with it. See
          # tools/android/README.md for why publishing it costs nothing.
          keytool -list -keystore tools/android/debug.keystore \
            -storepass android -alias androiddebugkey

      - name: Point Godot at the Android SDK and that keystore
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK at $sdk"
          # Fail here, where the reason is obvious, rather than inside Godot,
          # where it is an empty list of configuration errors.
          test -x "$sdk/platform-tools/adb"
          ls "$sdk/build-tools"
          ls "$sdk"/build-tools/*/apksigner
          mkdir -p "$HOME/.config/godot"
          # Writing this file by hand means Godot gets these four settings and
          # the built-in default for everything else — including the Java SDK
          # path, which it would otherwise fill in from JAVA_HOME the first
          # time an editor starts. It signs the APK with apksigner, which is a
          # shell script that needs java, so leaving it empty fails the export.
          # Which file Godot reads depends on how it spells its own version,
          # so both spellings are written and whichever it opens is right.
          for name in editor_settings-4.tres editor_settings-4.6.tres; do
            cat > "$HOME/.config/godot/$name" <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$PWD/tools/android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          TRES
          done
          # Newer Godot takes the keystore from the environment instead.
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/tools/android/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          echo "--- what Godot will read ---"
          cat "$HOME/.config/godot/editor_settings-4.6.tres"

      - name: Stamp the build with a version
        # Android decides whether an APK is an upgrade or a reinstall by
        # versionCode, and an updater — Obtainium, say — decides whether to
        # offer it by the version it can read. A preset pinned at 1 makes every
        # build look like the same build, so a phone that already has one never
        # sees a newer one. The run number only ever goes up, which is exactly
        # what versionCode has to do.
        run: |
          VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}"
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" \
            game/export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"${VERSION_NAME}\"|" \
            game/export_presets.cfg
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          grep -n "^version/" game/export_presets.cfg

      - name: Import the project
        run: godot --headless --path game --import

      - name: Export the APK
        run: |
          mkdir -p build
          godot --headless --path game --export-debug Android \
            "$PWD/build/revolutionaries-debug.apk"

      - name: Check that it is really an APK, signed with the key we expect
        run: |
          test -s build/revolutionaries-debug.apk
          unzip -l build/revolutionaries-debug.apk | grep -q AndroidManifest.xml
          apksigner="$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner | tail -1)"
          "$apksigner" verify --print-certs build/revolutionaries-debug.apk \
            | tee /tmp/certs.txt
          # The whole point of checking the key in is that this never changes:
          # Android will not install a new version over one signed by a
          # different key, and an uninstall takes the player's saves with it.
          # If this line ever fails, somebody replaced the key, and every
          # phone with a playtest build on it is about to be stranded.
          grep -qi "SHA-256 digest: $EXPECTED" /tmp/certs.txt \
            || { echo "signed with the wrong key"; exit 1; }
          ls -l build/revolutionaries-debug.apk
        env:
          EXPECTED: 55f67f933075fc847d290b67233ba3543b582e31bbe060377da643cb232f8ba7

      - uses: actions/upload-artifact@v4
        with:
          name: revolutionaries-android-debug
          path: build/revolutionaries-debug.apk
          if-no-files-found: error

      - name: Roll the mobile-latest prerelease over to this build
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mobile-latest --yes --cleanup-tag || true
          # The version is in the release title as well as in the APK, because
          # an updater watching this repository reads the title to decide
          # whether what is published is newer than what is installed.
          gh release create mobile-latest build/revolutionaries-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Playtest build $VERSION_NAME" \
            --notes "Debug APK built from ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d).
          Version $VERSION_NAME.

          **Installing it once.** Download the .apk below, open it, and allow
          installing from this app when Android asks. It is signed with a
          throwaway debug key, so Android will treat it as an app from an
          unknown developer — that is expected for a playtest build.

          **Having it update itself.** Install
          [Obtainium](https://github.com/ImranR98/Obtainium/releases), add an
          app with this repository's URL, and tick *Include prereleases*.
          Obtainium checks on its own schedule and offers each new build; the
          key never changes, so updates install over the top and the saves stay
          where they are.

          This release is rolled over on every push to master, so the link
          above always points at the newest build."
