name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  layers:
    name: Layer rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check architecture layer rules
        run: python3 tools/check_layers.py
      - name: Every legacy function is accounted for
        run: python3 tools/audit_parity.py
      - name: Every piece of legacy state is accounted for
        run: python3 tools/audit_state.py
      - name: Every decision the original stops for is answerable
        run: python3 tools/audit_choices.py
      - name: Every piece of the original's content is in the port
        run: python3 tools/audit_content.py
      - name: Every label the original has words for uses them
        run: python3 tools/audit_voice.py
      - name: Every entry point in core can be reached
        run: python3 tools/audit_reach.py
      - name: The interface is built out of its own pieces
        run: python3 tools/audit_design.py
      - name: Every colour can be read, and the two sides stay apart
        run: python3 tools/audit_contrast.py
      - name: The content is what the extractor produces, unedited
        run: |
          python3 tools/extract_data.py
          git diff --exit-code -- game/data

  tests:
    name: Headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6
        run: |
          curl -sSL -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6-stable_linux.x86_64
          sudo mv Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
      - name: Run tests
        run: tools/run_tests.sh

  layout:
    name: Rendered layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6 and a virtual screen
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0
          curl -sSL -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6-stable_linux.x86_64
          sudo mv Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
      - name: Nothing is drawn outside the thing that contains it
        run: tools/check_layout.sh
